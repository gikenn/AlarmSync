<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Pulse Ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" fill="none" />
  
  <!-- Central Bell Icon -->
  <g transform="translate(256, 240)">
    <!-- Bell Top Ring -->
    <path d="M -16 -120 A 16 16 0 0 1 16 -120" stroke="#818cf8" stroke-width="12" fill="none" stroke-linecap="round" />
    
    <!-- Bell Body -->
    <path d="M 0 -110 C -60 -110 -90 -60 -90 10 C -90 45 -115 65 -130 85 L 130 85 C 115 65 90 45 90 10 C 90 -60 60 -110 0 -110 Z" fill="url(#accentGrad)" />
    
    <!-- Bell Clapper -->
    <circle cx="0" cy="105" r="28" fill="url(#goldGrad)" />
    
    <!-- Sound Waves -->
    <path d="M -150 -10 A 180 180 0 0 0 -150 70" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 150 -10 A 180 180 0 0 1 150 70" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none" />
    
    <path d="M -185 -30 A 230 230 0 0 0 -185 90" stroke="#818cf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 185 -30 A 230 230 0 0 1 185 90" stroke="#818cf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>
</svg>
